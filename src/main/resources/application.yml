server:
  port: 8080

spring:
  application:
    name: user-service

  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      port: 6379
      timeout: 2000ms

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yml

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

grpc:
  server:
    port: 9090
    security:
      enabled: false

jwt:
  secret: ${JWT_SECRET_KEY}

service:
  secret: ${SERVER_SECRET_KEY}

logging:
  level:
    root: INFO
    com.innowise.userservice: DEBUG